<title>Practice Intelligence</title>
<meta name="description" content="GP Practice Intelligence renderer (v8 layout). Reads one practice payload; shows real data only.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* ================= TOKENS — Palette 2 "Plum & Sand" ================= */
:root{
  --bg:#efe7da;--card:#faf6ef;--card2:#f4ede2;--ink:#2b2029;--muted:#6b5d66;--faint:#8b7e86;--line:#e2d6c5;--soft:#ece3d5;--grid:#e3d8c8;
  --nav:#3b1f3f;--nav2:#4d2a52;--navink:#fbf6ef;--navmuted:#d8c7cf;--navchip:rgba(255,255,255,.08);--navline:rgba(255,255,255,.13);
  --sand:#c2a98a;--brand:#6a3f7a;--brand-soft:#efe4ef;
  --practice:#6a3f7a;--cmp:#968c85;--target:#2b2029;
  --crit:#b3362c;--crit-soft:#f6e1dc;--warn:#8a6508;--warn-bar:#b8860b;--warn-soft:#f4ead0;--good:#3f7d4f;--good-soft:#e2ede3;--neutral-soft:#e9e1d5;
  --focus1:#3b1f3f;--focus2:#2a1530;--focusink:#f3e9ee;--focusmuted:#cdb9c4;
  --shadow:0 16px 40px rgba(59,31,63,.10);--shadow-sm:0 4px 16px rgba(59,31,63,.06);
  --h0:#efe3ef;--h1:#dcc3df;--h2:#c39ec9;--h3:#a576b0;--h4:#84528f;--h5:#5f3368;--hna:#ece5dc;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"Source Sans 3",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1419;--card:#251c23;--card2:#2c222a;--ink:#f1e9e4;--muted:#bfb0b5;--faint:#978991;--line:#3a2e37;--soft:#30252e;--grid:#3a2e37;
  --nav:#1a1019;--nav2:#2e1b31;--navmuted:#c9b6c0;
  --brand:#c39ad3;--brand-soft:#3a2940;--practice:#c39ad3;--cmp:#7d746e;--target:#f1e9e4;
  --crit:#e2735c;--crit-soft:#3d221d;--warn:#e0b04a;--warn-bar:#e0b04a;--warn-soft:#382d16;--good:#6fb584;--good-soft:#1c3123;--neutral-soft:#322830;
  --focus1:#2e1b31;--focus2:#1f1222;--shadow:0 16px 40px rgba(0,0,0,.4);--shadow-sm:0 4px 16px rgba(0,0,0,.3);
  --h0:#2e2230;--h1:#44304a;--h2:#5e4066;--h3:#7d5587;--h4:#a076ab;--h5:#c9a3d4;--hna:#2a2128;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1419;--card:#251c23;--card2:#2c222a;--ink:#f1e9e4;--muted:#bfb0b5;--faint:#978991;--line:#3a2e37;--soft:#30252e;--grid:#3a2e37;
  --nav:#1a1019;--nav2:#2e1b31;--navmuted:#c9b6c0;
  --brand:#c39ad3;--brand-soft:#3a2940;--practice:#c39ad3;--cmp:#7d746e;--target:#f1e9e4;
  --crit:#e2735c;--crit-soft:#3d221d;--warn:#e0b04a;--warn-bar:#e0b04a;--warn-soft:#382d16;--good:#6fb584;--good-soft:#1c3123;--neutral-soft:#322830;
  --focus1:#2e1b31;--focus2:#1f1222;--shadow:0 16px 40px rgba(0,0,0,.4);--shadow-sm:0 4px 16px rgba(0,0,0,.3);
  --h0:#2e2230;--h1:#44304a;--h2:#5e4066;--h3:#7d5587;--h4:#a076ab;--h5:#c9a3d4;--hna:#2a2128;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3,h4{text-wrap:balance}

/* ================= HEADER (v8) ================= */
.top{background:linear-gradient(135deg,var(--nav),var(--nav2));color:var(--navink);padding:22px 16px 26px}
.topin,.main{max-width:1320px;margin:auto}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brandmark{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:.03em}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#d9c3a3,var(--sand))}
.proto{font-size:12px;color:var(--navmuted);border:1px solid var(--navline);padding:6px 11px;border-radius:999px}
.title{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-top:22px;flex-wrap:wrap}
.title h1{font-family:var(--serif);font-weight:600;font-size:31px;margin:0 0 5px;letter-spacing:-.01em}
.sub{color:var(--navmuted);display:flex;gap:6px 14px;flex-wrap:wrap}
.context{display:flex;gap:10px;flex-wrap:wrap}
.ctx{min-width:112px;background:var(--navchip);border:1px solid var(--navline);padding:9px 12px;border-radius:10px}
.ctx b{display:block;font-size:19px;font-weight:600}
.ctx span{font-size:11px;color:var(--navmuted);text-transform:uppercase;letter-spacing:.05em}
.ctx small{color:#cfe0c4;font-size:11.5px;margin-left:5px;font-family:var(--sans);font-weight:600}
.main{padding:22px 16px 72px}

/* ================= HERO (v8) ================= */
.hero{display:grid;grid-template-columns:1.65fr .85fr;gap:16px}
.hero.solo{grid-template-columns:1fr}
.summary{border-radius:16px;box-shadow:var(--shadow);background:var(--card);padding:18px 24px;border:1px solid var(--line);position:relative;overflow:hidden}
.summary:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--brand);margin-bottom:10px}
.lines{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.lines li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:17px;line-height:1.4;font-weight:600}
.ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:2px}
.ic.attention{background:var(--crit-soft);color:var(--crit)}.ic.watch{background:var(--warn-soft);color:var(--warn)}.ic.good{background:var(--good-soft);color:var(--good)}.ic.normal{background:var(--neutral-soft);color:var(--muted)}
.focus{border-radius:16px;box-shadow:var(--shadow);background:linear-gradient(145deg,var(--focus1),var(--focus2));color:var(--focusink);padding:18px 22px;cursor:pointer;transition:.18s;border:0;text-align:left;display:flex;flex-direction:column}
.focus:hover{transform:translateY(-2px)}
.focus .eyebrow{color:var(--sand)}
.focus h3{margin:0 0 4px;font-size:19px;font-weight:700}
.focus p{margin:0;color:var(--focusmuted);font-size:14px}
.fmetric{display:flex;align-items:end;gap:12px;margin-top:14px}
.fmetric b{font-size:40px;font-weight:600;line-height:1}
.fmetric span{color:var(--focusmuted);font-size:12.5px;line-height:1.35}
.fbar{margin-top:14px;display:grid;gap:6px;font-size:12px;color:var(--focusmuted)}
.fbar .row{display:grid;grid-template-columns:52px 1fr 48px;gap:8px;align-items:center}
.fbar .tr{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.fbar .tr i{display:block;height:100%;border-radius:99px}
.cta{margin-top:auto;padding-top:14px;color:var(--sand);font-size:12px;font-weight:700}

/* ================= SECTIONS (v8) ================= */
.sectionIntro{display:flex;justify-content:space-between;align-items:end;margin:30px 0 12px;gap:12px;flex-wrap:wrap}
.sectionIntro h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.sectionIntro span{font-size:12px;color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.lg-p{width:14px;height:7px;border-radius:99px;background:var(--practice)}
.lg-c{width:3px;height:12px;background:var(--cmp);border-radius:1px}
.lg-t{width:2px;height:12px;background:var(--target)}
.contract{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:9px;transition:.18s;min-width:0}
.ct:hover{box-shadow:var(--shadow)}
.ct .k{font-size:12.5px;color:var(--muted);font-weight:600;min-height:34px;line-height:1.35}
.ct .v{font-size:28px;font-weight:600;line-height:1}
.ct .f{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.ct .fn{font-size:11.5px;color:var(--muted);line-height:1.35}
.bul{position:relative;height:22px}
.bul .tr{position:absolute;left:0;right:0;top:7px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bul .fl{height:100%;border-radius:99px;background:var(--practice)}
.bul .cm{position:absolute;top:2px;width:3px;height:18px;background:var(--cmp);border-radius:1px;margin-left:-1.5px}
.bul .tg{position:absolute;top:0;width:2px;height:22px;background:var(--target);margin-left:-1px}
.pill{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:5px 9px;border-radius:999px;font-weight:800;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.p-attention{background:var(--crit-soft);color:var(--crit)}.p-watch{background:var(--warn-soft);color:var(--warn)}
.p-normal{background:var(--neutral-soft);color:var(--muted)}.p-good{background:var(--good-soft);color:var(--good)}
.p-unable{border:1px dashed var(--faint);color:var(--faint)}
.std{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.std.bench{background:var(--neutral-soft);color:var(--muted)}
.changed{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.change{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;display:grid;grid-template-columns:1fr 130px;gap:2px 12px;align-items:center;cursor:pointer;text-align:left}
.change .k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;grid-column:1/-1;font-weight:700}
.change .v{font-size:25px;font-weight:600}
.change .d{font-size:13px;color:var(--muted);grid-column:1}
.change svg{grid-column:2;grid-row:2/4}
.change .flag{grid-column:1/-1;font-size:11.5px;color:var(--warn);margin-top:4px}
.up{color:var(--good)}.down{color:var(--crit)}.neu{color:var(--ink)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:13px;padding:14px 16px;color:var(--muted);font-size:14px}
.group{margin-top:22px}
.groupHead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.groupHead h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.11em}
.groupHead em{font-style:normal;font-size:12px;color:var(--faint)}
.groupHead:after{content:"";height:1px;background:var(--line);flex:1}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow-sm);padding:18px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
.card.inactive{cursor:default;box-shadow:none;background:var(--card2);border-style:dashed}
.card.inactive:hover{transform:none}
.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.area{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:700}
.card h4{font-size:18px;line-height:1.3;margin:0;max-width:560px;font-weight:700}
.metricrow{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.big{font-size:38px;font-weight:600;letter-spacing:-.01em;line-height:1}
.unit{color:var(--muted);font-size:13px}
.viz{border-top:1px solid var(--soft);padding-top:12px;display:grid;gap:8px}
.bl{display:grid;grid-template-columns:120px 1fr 58px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.bl b{text-align:right;color:var(--ink);font-size:13px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.rankdots{display:inline-flex;gap:3px;align-items:center}
.rankdots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.rankdots i.me{background:var(--practice)}
.pv{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:9px;padding:7px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pv .conf{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--good)}
.pv .conf.contradicts{color:var(--crit)}
.inv-cta{font-size:12px;font-weight:700;color:var(--brand)}
.reason{font-size:13.5px;color:var(--muted)}
.base{display:block;width:100%;font-size:11.5px;color:var(--faint);margin-top:2px}
.fixture-banner{max-width:1320px;margin:0 auto 16px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-bar);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600}
.footerNote{margin-top:28px;color:var(--faint);font-size:12px;max-width:1040px;line-height:1.55}

/* ================= DRAWER (v8 + L3 domain tabs) ================= */
.overlay{position:fixed;inset:0;background:rgba(27,14,28,.38);opacity:0;pointer-events:none;transition:.22s;z-index:20}
.drawer{position:fixed;right:0;top:0;height:100%;width:min(680px,100%);background:var(--card);box-shadow:-18px 0 50px rgba(27,14,28,.22);transform:translateX(105%);transition:transform .25s ease,width .25s ease;z-index:30;display:flex;flex-direction:column}
.drawer.wide{width:min(1040px,100%)}
body.open .overlay{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
body.open{overflow:hidden}
.drawerhead{padding:calc(20px + env(safe-area-inset-top,0px)) 24px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.close{float:right;border:0;background:var(--soft);border-radius:9px;width:34px;height:34px;cursor:pointer}
.drawerhead h2{font-size:22px;margin:6px 44px 8px 0;line-height:1.25;font-weight:700}
.dtabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.dtabs button,.subtabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.dtabs button[aria-selected="true"]{background:var(--nav);border-color:var(--nav);color:#fff}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button[aria-selected="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.dtabs button:disabled,.subtabs button:disabled{opacity:.4;cursor:not-allowed}
.drawerbody{padding:20px 24px calc(42px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:20px}
.q .qt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-bottom:10px}
.panel{border:1px solid var(--line);border-radius:13px;padding:14px;background:var(--card2);display:grid;gap:10px;min-width:0}
.panel > b{font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.st b{display:block;font-size:22px;font-weight:600}
.st span{font-size:12.5px;color:var(--muted);display:block}
.st small{font-size:11.5px;color:var(--faint)}
.look{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.look li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px;align-items:start}
.ev{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-top:2px;white-space:nowrap}
.ev.t{background:var(--good-soft);color:var(--good)}
.ev.o{background:var(--neutral-soft);color:var(--muted)}
.interp{border-left:3px solid var(--brand);padding:3px 0 3px 14px;font-size:15px}
.note{font-size:12.5px;color:var(--faint)}
.evtab{width:100%;border-collapse:collapse;font-size:13px}
.evtab td,.evtab th{padding:7px 0;border-bottom:1px solid var(--line);text-align:left}
.evtab th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.evtab td:last-child,.evtab th:last-child{text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums}
.evtab tr.no td{color:var(--faint)}
.srcs{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;max-width:100%}
table.dt{border-collapse:collapse;width:100%;font-size:13px}
.dt th,.dt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dt th:first-child,.dt td:first-child{text-align:left}
.dt th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.dt td.n{font-family:var(--serif);font-variant-numeric:tabular-nums}
.na{color:var(--faint)}
.detailBtn{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;font-weight:700;color:var(--brand);cursor:pointer}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.pair small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;margin-bottom:2px}
.pair .vd{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.pair .vd.contradicts{background:var(--crit-soft);color:var(--crit)}
svg text{font-family:var(--sans);fill:var(--muted)}
svg .n{font-family:var(--serif)}
svg .ink{fill:var(--ink)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--nav);color:#fff;font-size:13px;padding:6px 9px;border-radius:7px;max-width:260px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
@media(max-width:1100px){.contract{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hero,.board,.changed{grid-template-columns:1fr}.card.wide{grid-column:auto}.title{align-items:start}}
@media(max-width:520px){.contract{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.drawerhead,.drawerbody{padding-left:16px;padding-right:16px}.change{grid-template-columns:1fr 100px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="topin">
  <div class="brand"><div class="brandmark"><span class="logo"></span>Practice Intelligence</div><span class="proto" id="pRun"></span></div>
  <div class="title"><div><h1 id="pName"></h1><div class="sub" id="pSub"></div></div><div class="context" id="pCtx"></div></div>
</div></header>

<main class="main">
  <div class="fixture-banner" id="fixtureBanner" role="note" hidden>Design reference. Figures marked illustrative in this fixture are not real practice data.</div>
  <section class="hero" id="hero">
    <div class="summary" id="summary"><div class="eyebrow">✦ AI Practice Assessment</div><ul class="lines" id="assess"></ul></div>
    <button class="focus" id="focus"></button>
  </section>

  <div id="chWrap"><div class="sectionIntro"><h3>What changed</h3><span id="chBasis"></span></div>
  <section class="changed" id="changed"></section></div>

  <div id="msWrap"><div class="sectionIntro"><h3>NHS access measures</h3>
    <div class="legend"><span><i class="lg-p"></i>Practice</span><span><i class="lg-c"></i>ICB</span><span><i class="lg-t"></i>Target / ambition where applicable</span></div></div>
  <section class="contract" id="contract"></section></div>

  <div class="sectionIntro"><h3>Management areas</h3>
    <div class="legend"><span><i class="lg-p"></i>Practice</span><span><i class="lg-c"></i>ICB</span><span><span class="rankdots"><i class="me"></i><i></i></span> PCN rank</span></div></div>
  <div id="groups"></div>

  <p class="footerNote" id="foot"></p>
</main>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="dr" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="drawerhead"><button class="close" id="dClose" aria-label="Close">✕</button>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="dPill"></span><span class="area" id="dArea"></span></div>
    <h2 id="dTitle"></h2>
    <div class="metricrow"><span class="big num" id="dMetric"></span><span class="unit" id="dUnit"></span></div>
    <div class="dtabs" role="tablist" id="dTabs"></div>
  </div>
  <div class="drawerbody" id="dBody"></div>
</aside>
<div class="tip" id="tip" role="tooltip"></div>

<script type="application/json" id="pi-payload">__PAYLOAD__</script>
<script>
"use strict";
/* =====================================================================
   Practice Intelligence renderer — v8 layout, Palette 2, real data only.
   Reads ONE practice payload (schema/payload.schema.json). No data or NHS logic lives here.
   Rules:  pipeline mode: anything not real is absent (never shown, never zero).
           fixture mode (run.mode = "fixture"): illustrative values are shown, with a banner.
           availability: available -> shown · no_data -> inactive card with reason
                         unsupported -> hidden · not_built -> hidden (fixture: shown, marked "Not built")
           block / row / tab with nothing displayable -> left out; empty tab disabled
   ===================================================================== */
const P=JSON.parse(document.getElementById('pi-payload').textContent);
const FIXTURE=P.run&&P.run.mode==='fixture';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const real=x=>x!=null&&(FIXTURE||(!(typeof x==='object'&&x.prov==='illustrative')&&!(typeof x==='string'&&/\[\[/.test(x))));
const ok=p=>FIXTURE||p!=='illustrative';
const V=x=>real(x)?esc(typeof x==='object'?x.d:x):'<span class="na" title="Not available">–</span>';
const T=s=>real(s)?esc(String(s).replace(/\[\[(.+?)\]\]/g,'$1')):'';
const base=x=>x&&typeof x==='object'&&x.base?`<span class="base">${esc(x.base)}</span>`:'';

const ST={not_built:['p-unable','Not built yet','◌'],attention:['p-attention','Attention','▲'],watch:['p-watch','Watch','○'],normal:['p-normal','Normal','–'],good:['p-good','Performing well','✓'],unable:['p-unable','Unable to assess','?']};
const ORD={attention:0,watch:1,normal:2,good:3,unable:4};
/* The one fixed assurance list. Labels come from here, never from payload copy. */
const ASSURE={contract_requirement:'Contract requirement',national_ambition:'National ambition',qof_threshold:'QOF threshold',local_expectation:'ICB expectation',benchmark:'Benchmark'};
const TONE={practice:'var(--practice)',cmp:'var(--cmp)',crit:'var(--crit)',warn:'var(--warn-bar)',good:'var(--good)',accent:'var(--sand)'};
const pill=s=>`<span class="pill ${ST[s][0]}">${ST[s][2]} ${ST[s][1]}</span>`;
const std=a=>a&&a!=='none'?`<span class="std ${a==='benchmark'?'bench':''}">${ASSURE[a]}</span>`:'';
const rank=r=>r?`<span class="rankdots" data-tip="Ranked within PCN for this measure" aria-label="${r.pos} of ${r.n} practices in PCN">${Array.from({length:r.n},(_,i)=>`<i class="${i===r.pos-1?'me':''}"></i>`).join('')}<span style="margin-left:4px;color:var(--muted)">${r.pos} of ${r.n} practices</span></span>`:'<span></span>';
const statusTone=s=>({attention:'crit',watch:'warn',good:'good'}[s]||'practice');

/* ---------------- area state ---------------- */
function areaState(a){
  const av=a.availability||'available';
  if(av==='no_data')return 'inactive';
  if(av==='unsupported')return 'hidden';
  if(av==='not_built')return FIXTURE?'live':'hidden';
  return real(a.metric)?'live':'hidden'}
const prio=a=>(a.priority&&a.priority.score_internal)||0;

/* ---------------- chart components (block spec -> html) ---------------- */
function nice(mx){const e=Math.pow(10,Math.floor(Math.log10(mx||1))),f=mx/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function bullet(v,c,max,{t=null,tone='practice',u=''}={}){const p=x=>Math.max(0,Math.min(100,x/max*100));
  return `<div class="bul" role="img" aria-label="Practice ${v}${u}${c!=null?`, ICB ${c}${u}`:''}${t!=null?`, target ${t}${u}`:''}"><div class="tr"><div class="fl" style="width:${p(v)}%;background:${TONE[tone]||TONE.practice}" data-tip="Practice ${v}${u}"></div></div>${c!=null?`<span class="cm" style="left:${p(c)}%" data-tip="ICB ${c}${u}"></span>`:''}${t!=null?`<span class="tg" style="left:${p(t)}%" data-tip="Target ${t}${u}"></span>`:''}</div>`}
const C={
 bullet_rows(b){const rows=b.rows.filter(r=>real(r.value));if(!rows.length)return null;
   return rows.map(r=>{const u=r.unit??b.unit??'';return `<div class="bl"><span>${esc(r.label)}</span>${bullet(r.value.v,r.cmp,r.max,{t:r.target,tone:r.tone,u})}<b class="num">${V(r.value)}</b></div>`}).join('')},
 columns(b,{w=560,h=170}={}){if(b.compact){w=480;h=128}const d=b.bars,pl=34,pt=12,iw=w-pl-8,ih=h-24-pt,cmp=b.cmp||null,u=b.unit||'',hl=b.highlight||[];
   const mx=b.y_max||nice(Math.max(...d.map(x=>x.v),...(cmp?cmp.values:[0]))*1.05),bw=iw/d.length,y=v=>pt+ih-v/mx*ih;
   return `<div class="tw"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(b.title||'Bar chart')}: ${d.map(x=>x.l+' '+x.v+u).join(', ')}">
   ${[0,mx/2,mx].map(t=>`<line x1="${pl}" x2="${w-8}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--grid)"/><text x="${pl-6}" y="${y(t)+4}" font-size="10.5" text-anchor="end" class="n">${+t.toFixed(2)}${u}</text>`).join('')}
   ${d.map((x,i)=>{const bx=pl+i*bw+bw*.2,b2=bw*.6,top=y(x.v),r=Math.min(4,pt+ih-top);return `<path d="M${bx},${pt+ih}V${top+r}q0,-${r} ${r},-${r}h${b2-2*r}q${r},0 ${r},${r}V${pt+ih}Z" style="fill:${hl.includes(i)?'var(--crit)':'var(--practice)'};opacity:${hl.length&&!hl.includes(i)?.55:1}" data-tip="${esc(x.l)}: ${x.v}${u}${cmp?` · ${cmp.label} ${cmp.values[i]}${u}`:''}"/><text x="${bx+b2/2}" y="${h-7}" font-size="11" text-anchor="middle">${esc(x.l)}</text>`}).join('')}
   ${cmp?`<path d="${cmp.values.map((c,i)=>`${i?'L':'M'}${pl+i*bw+bw/2},${y(c)}`).join('')}" fill="none" style="stroke:var(--cmp)" stroke-width="2" stroke-dasharray="5 4"/>`:''}</svg></div>`},
 hbars(b,{w=580}={}){const rows=b.rows,cmpOk=ok(b.cmp_prov),u=b.unit||'';
   const max=b.max||Math.max(...rows.flatMap(r=>[r.v,r.c??0,r.t??0]))*1.1,lw=Math.min(190,Math.max(90,Math.max(...rows.map(r=>r.l.length))*7+8)),bw=w-lw-96,rh=30,h=rows.length*rh+4,s=v=>v/max*bw;
   return `<div class="tw"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(b.title||'Bars')}: ${rows.map(r=>r.l+' '+(r.lab||r.v+u)).join(', ')}">${rows.map((r,i)=>{const y=i*rh+3,c=cmpOk?r.c:null;return `<text x="0" y="${y+15}" font-size="12.5" class="ink">${esc(r.l)}</text><rect x="${lw}" y="${y+6}" width="${Math.max(3,s(r.v))}" height="10" rx="5" style="fill:${TONE[r.tone]||TONE.practice}" data-tip="${esc(r.l)}: ${r.v}${u}${c!=null?` · ICB ${c}${u}`:''}"/>${r.t!=null?`<rect x="${lw+s(r.t)-1}" y="${y}" width="2" height="22" style="fill:var(--target)" data-tip="Threshold ${r.t}${u}"/>`:''}${c!=null?`<rect x="${lw+s(c)-1.5}" y="${y+1}" width="3" height="20" rx="1" style="fill:var(--cmp)" data-tip="ICB ${c}${u}"/>`:''}<text x="${lw+Math.max(s(r.v),c!=null?s(c):0,r.t!=null?s(r.t):0)+8}" y="${y+15}" font-size="12.5" class="n ink">${esc(r.lab??(r.v+u))}</text>`}).join('')}</svg></div>`},
 lines(b,{w=580,h=190}={}){if(b.compact){w=460;h=150}const series=b.series.filter(s=>ok(s.prov??b.prov));if(!series.length)return null;
   const L=b.labels,pl=38,pt=12,iw=w-pl-112,ih=h-24-pt,all=series.flatMap(s=>s.values),mn=Math.min(...all),mx=Math.max(...all),pad=(mx-mn||1)*.12,lo=mn-pad,hi=mx+pad,x=i=>pl+i*iw/(L.length-1),y=v=>pt+ih-(v-lo)/(hi-lo)*ih,u=b.unit||'';
   const st=nice((hi-lo)/3),ticks=[];for(let t=Math.ceil(lo/st)*st;t<=hi;t+=st)ticks.push(+t.toFixed(2));
   const lab=series.map((s,k)=>({k,y:y(s.values[s.values.length-1])})).sort((a,b)=>a.y-b.y);for(let i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<14)lab[i].y=lab[i-1].y+14;const LY={};lab.forEach(o=>LY[o.k]=o.y);
   return `<div class="tw"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(b.title||'Line chart')}: ${series.map(s=>s.name+' '+s.values[0]+' to '+s.values[s.values.length-1]).join('; ')}">${ticks.map(t=>`<line x1="${pl}" x2="${pl+iw}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--grid)"/><text x="${pl-6}" y="${y(t)+4}" font-size="10.5" text-anchor="end" class="n">${t}${b.absolute?u:''}</text>`).join('')}${L.map((l,i)=>`<text x="${x(i)}" y="${h-7}" font-size="11" text-anchor="middle">${esc(l)}</text>`).join('')}
   ${series.map((s,k)=>{const col=TONE[s.tone]||TONE.practice;return `<path d="${s.values.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join('')}" fill="none" style="stroke:${col}" stroke-width="2.25"/>${s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===s.values.length-1?4.5:3}" style="fill:${col};stroke:var(--card)" stroke-width="2" data-tip="${esc(s.name)} · ${esc(L[i])}: ${v}${b.absolute?u:''}"/>`).join('')}<text x="${x(s.values.length-1)+10}" y="${LY[k]+4}" font-size="12" class="ink" style="font-weight:600">${esc(s.name)}</text>`}).join('')}</svg></div>`},
 heatmap(b,{w=560}={}){w=Math.min(w,720);const lw=48,cw=(w-lw)/b.cols.length,ch=26,h=b.rows.length*ch+26,ramp=['--h0','--h1','--h2','--h3','--h4','--h5'],c=x=>`var(${ramp[Math.min(5,Math.floor(x/b.max*6))]})`;
   return `<div class="tw"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(b.title)}">${b.cols.map((d,j)=>`<text x="${lw+j*cw+cw/2}" y="14" font-size="11" text-anchor="middle">${esc(d)}</text>`).join('')}${b.rows.map((r,i)=>`<text x="0" y="${24+i*ch+16}" font-size="11" class="n">${esc(r)}</text>`+b.cols.map((d,j)=>{const x=b.values[i][j];return `<rect x="${lw+j*cw+1}" y="${24+i*ch}" width="${cw-2}" height="${ch-2}" rx="4" style="fill:${x==null?'var(--hna)':c(x)}" data-tip="${esc(d)} ${esc(r)}: ${x==null?'too few calls':x+(b.unit||'')}"/>${x!=null&&x>=b.max*.62?`<text x="${lw+j*cw+cw/2}" y="${24+i*ch+16}" font-size="10.5" text-anchor="middle" class="n" style="fill:#fff">${x}</text>`:''}`}).join('')).join('')}</svg></div>`},
 outcomes(b,{w=580}={}){const steps=b.steps.filter(s=>ok(s.prov));if(steps.length<2)return null;const mx=steps[0].v,rh=32,h=steps.length*rh+4,lw=170,bw=w-lw-120;
   return `<div class="tw"><svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(b.title)}: ${steps.map(s=>s.l+' '+s.v).join(', ')}">${steps.map((s,i)=>{const y=i*rh+2,ww=Math.max(4,s.v/mx*bw);return `<text x="0" y="${y+19}" font-size="12.5" class="ink">${esc(s.l)}</text><rect x="${lw}" y="${y+7}" width="${ww}" height="16" rx="8" style="fill:${TONE[s.tone]||TONE.practice}" data-tip="${esc(s.l)}: ${s.v.toLocaleString('en-GB')} calls"/><text x="${lw+ww+8}" y="${y+19}" font-size="12.5" class="n ink">${s.v.toLocaleString('en-GB')} · ${esc(s.p)}</text>`}).join('')}</svg></div>`},
 table(b){const rows=b.rows.filter(r=>r.slice(1).some(real));if(!rows.length)return null;return `<div class="tw"><table class="dt"><thead><tr>${b.columns.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,j)=>j?`<td class="n">${V(c)}</td>`:`<td>${V(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`},
 paired(b){return `<div style="display:grid;gap:8px">${b.rows.map(r=>`<div class="pair"><div><small>Patients say</small>${esc(r.patient)}</div><span class="vd ${r.verdict}">${esc(r.verdict)}</span><div><small>Data shows</small>${esc(r.operational)}</div></div>`).join('')}</div>`},
 note(b){return `<div class="note">${T(b.text)}</div>`}
};
/* returns html or '' when the block has nothing real to show */
function block(b,opts,wrap=true){if(!ok(b.prov))return '';const f=C[b.type];if(!f)return '';const inner=f(b,opts);if(inner==null)return '';
  if(!wrap)return (b.note?`<div class="note">${esc(b.note)}</div>`:'')+inner;
  return `<div class="panel">${b.title?`<b>${esc(b.title)}</b>`:''}${b.note?`<div class="note">${esc(b.note)}</div>`:''}${inner}</div>`}
function spark(vals,{w=130,h=44,tone='practice'}={}){const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1,p=5,col=TONE[tone];
  const x=i=>p+i*(w-2*p)/(vals.length-1),y=v=>h-p-(v-mn)/r*(h-2*p),d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(''),L=vals.length-1;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}L${x(L)},${h}L${x(0)},${h}Z" style="fill:${col}" opacity=".1"/><path d="${d}" fill="none" style="stroke:${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(L)}" cy="${y(vals[L])}" r="4" style="fill:${col};stroke:var(--card)" stroke-width="2"/></svg>`}

/* ================= L1 ================= */
function render(){
  const p=P.practice;document.title=`${p.name} · Practice Intelligence${FIXTURE?' (design reference)':''}`;
  $('#fixtureBanner').hidden=!FIXTURE;
  $('#pRun').textContent=`${p.period.label} data`;
  $('#pName').textContent=p.name;
  $('#pSub').innerHTML=[esc(p.icb),`PCN of ${p.pcn.size} practices`,`${esc(p.period.label)} data`].map(s=>`<span>${s}</span>`).join('');
  $('#pCtx').innerHTML=P.context.filter(c=>real(c.value)).map(c=>`<div class="ctx"${c.hint?` title="${esc(c.hint)}"`:''}><b class="num">${V(c.value)}${real(c.delta)?`<small>${V(c.delta)}</small>`:''}</b><span>${esc(c.label)}</span></div>`).join('');

  /* assessment + attention */
  const lines=P.assessment.lines.filter(l=>ok(l.prov)&&P.areas[l.area]&&areaState(P.areas[l.area])==='live');
  $('#summary').hidden=!lines.length;
  $('#assess').innerHTML=lines.map(l=>`<li><span class="ic ${l.status}" aria-label="${ST[l.status][1]}">${ST[l.status][2]}</span><span>${esc(l.text)}</span></li>`).join('');
  const at=P.attention,aa=P.areas[at.area],showAt=real(at.metric)&&aa&&areaState(aa)==='live';
  $('#focus').hidden=!showAt;$('#hero').classList.toggle('solo',!(lines.length&&showAt));$('#hero').hidden=!(lines.length||showAt);
  if(showAt){const tone=statusTone(aa.status),you={crit:'#e6907c',warn:'#e0b04a',good:'#8cc79c',practice:'#d9b8e3'}[tone];
    $('#focus').dataset.open=at.area;
    $('#focus').innerHTML=`<div class="eyebrow">What requires particular attention</div><h3>${esc(at.title)}</h3><p>${esc(at.text)}</p>
     <div class="fmetric"><b class="num">${V(at.metric)}</b><span>${esc(at.metric_label)}</span></div>
     <div class="fbar">${at.compare.filter(c=>real(c.value)).map(c=>`<div class="row"><span>${esc(c.label)}</span><span class="tr"><i style="width:${Math.min(100,c.value.v/at.scale_max*100)}%;background:${c.label==='You'?you:'#a89b94'}"></i></span><span class="num">${V(c.value)}</span></div>`).join('')}</div>
     <div class="cta">Open focused investigation →</div>`}

  /* what changed: section hidden if nothing real was produced; message if engine found nothing material */
  const all=P.changes.items,ch=all.filter(c=>real(c.delta)&&ok(c.series_prov)&&P.areas[c.area]&&areaState(P.areas[c.area])!=='hidden');
  $('#chWrap').hidden=all.length>0&&!ch.length;
  $('#chBasis').textContent=P.changes.basis;
  $('#changed').innerHTML=ch.length?ch.map(c=>{const cls=c.good===true?'up':c.good===false?'down':'neu',tone=c.good===true?'good':c.good===false?'crit':'practice';
    return `<button class="change" data-open="${c.area}"><div class="k">${esc(c.label)}</div><div class="v num ${cls}">${V(c.delta)}</div><div class="d">${T(c.text)}</div>${spark(c.series,{tone})}${c.flag?`<div class="flag">${esc(c.flag)}</div>`:''}</button>`}).join('')
    :`<div class="empty" style="grid-column:1/-1">No material changes this month.</div>`;

  /* access measures: only real ones; hidden entirely if none */
  const ms=P.access_measures.items.filter(m=>real(m.value));
  $('#msWrap').hidden=!ms.length;
  $('#contract').innerHTML=ms.map(m=>{const b=m.bullet;return `<button class="ct" data-open="${m.area}"><div class="k">${esc(m.label)} · ${esc(m.sub)}</div><div class="v num">${V(m.value)}</div>${base(m.value)}${bullet(b.v,b.cmp,b.max,{t:b.target,tone:statusTone(m.status)})}<div class="f"><span>${esc(b.cmp_label||'')}${b.target_label?' · '+esc(b.target_label):''}</span></div>${m.footnote?`<div class="fn">${esc(m.footnote)}</div>`:''}<div class="f">${pill(m.status)}${std(m.assurance)}</div></button>`}).join('');

  /* groups (v8: one group per management area family) */
  $('#groups').innerHTML=P.groups.map(g=>{const items=Object.entries(P.areas).filter(([,a])=>a.group===g.id&&areaState(a)!=='hidden')
      .sort((x,y)=>(areaState(x[1])==='inactive')-(areaState(y[1])==='inactive')||ORD[x[1].status]-ORD[y[1].status]||prio(y[1])-prio(x[1]));
    if(!items.length)return '';
    return `<section class="group" aria-labelledby="g-${g.id}"><div class="groupHead"><h4 id="g-${g.id}">${esc(g.title)}</h4><em>${esc(g.question)}</em></div><div class="board">${items.map(([id,a])=>card(id,a)).join('')}</div></section>`}).join('');
  $('#foot').innerHTML=(P.footer.note?esc(P.footer.note)+' ':'')+`Sources: ${esc(P.footer.sources)} ${esc(P.footer.licence)}`;
}
function card(id,a){
  if(areaState(a)==='inactive')return `<div class="card inactive ${a.wide?'wide':''}"><div class="cardtop"><span class="area">${esc(a.title)}</span>${pill('unable')}</div><h4>${esc(a.question)}</h4><div class="reason">${esc(a.unavailable_reason||'No data published for this practice this month.')}</div></div>`;
  const viz=(a.card||[]).map(b=>block(b,{},false)).filter(Boolean).join('');
  return `<button class="card ${a.wide?'wide':''}" data-open="${id}">
   <div class="cardtop"><span class="area">${esc(a.title)}</span>${pill(a.availability==='not_built'?'not_built':a.status)}</div>
   <h4>${esc(a.headline)}</h4>
   <div class="metricrow"><span class="big num">${V(a.metric)}</span><span class="unit">${T(a.metric_label)}</span>${base(a.metric)}</div>
   ${viz?`<div class="viz">${viz}</div>`:''}
   ${a.patient_voice&&real(a.patient_voice.text)?`<div class="pv"><span>Patients say: ${V(a.patient_voice.text)}</span><span class="conf ${a.patient_voice.verdict}">${esc(a.patient_voice.verdict)}</span></div>`:''}
   <div class="meta">${rank(a.rank)}${a.trend&&ok(a.trend.prov)?spark(a.trend.values,{w:110,h:32,tone:statusTone(a.status)}):''}</div>
   <div class="meta">${std(a.assurance)}<span class="inv-cta">Investigate →</span></div>
  </button>`}

/* ================= DRAWER: Overview | Evidence | Detailed analysis (domain tabs) ================= */
let cur=null,tab='l2',sub=null,last=null;const dr=$('#dr');
function l3Tabs(a){return (a.l3?a.l3.tabs:[]).map(t=>({...t,html:t.blocks.map(b=>block(b,{w:760})).filter(Boolean).join('')}))}
function open(id){const a=P.areas[id];if(!a||areaState(a)!=='live')return;if(!cur)last=document.activeElement;cur=id;tab='l2';sub=null;
  $('#dPill').innerHTML=pill(a.status)+' '+std(a.assurance);$('#dArea').textContent=a.title;$('#dTitle').textContent=a.headline;
  $('#dMetric').innerHTML=V(a.metric);$('#dUnit').textContent=T(a.metric_label);
  const hasL3=l3Tabs(a).some(t=>t.html);
  $('#dTabs').innerHTML=`<button role="tab" data-tab="l2">Overview</button><button role="tab" data-tab="ev">Evidence</button><button role="tab" data-tab="l3" ${hasL3?'':'disabled title="Not enough detail in the published data"'}>Detailed analysis</button>`;
  dr.hidden=false;requestAnimationFrame(()=>document.body.classList.add('open'));show();$('#dClose').focus()}
function show(){const a=P.areas[cur],L=a.l2;document.querySelectorAll('#dTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));dr.classList.toggle('wide',tab==='l3');
  const q=(t,b)=>`<section class="q"><div class="qt">${t}</div>${b}</section>`;let h='';
  if(tab==='l2'){const what=L.what.filter(w=>real(w.value)),where=L.where.map(b=>block(b)).filter(Boolean).join(''),look=L.investigate.filter(i=>ok(i.prov)&&real(i.text));
    if(what.length)h+=q('What is happening',`<div class="stats">${what.map(s=>`<div class="st"><b class="num">${V(s.value)}</b><span>${esc(s.label)}</span><small>${T(s.sub)}</small>${base(s.value)}</div>`).join('')}</div>`);
    if(where)h+=q('Where',where);
    if(look.length)h+=q('What to look into',`<div class="panel"><ul class="look">${look.map(i=>`<li><span class="ev ${i.kind==='association'?'t':'o'}">${i.kind==='association'?'Tested':'Observed'}</span><span>${esc(i.text)}</span></li>`).join('')}</ul><div class="note">Things to check, not recommendations.</div></div>`);
    if(L.interpretation&&ok(L.interpretation.prov)&&L.interpretation.text)h+=q('Assessment',`<div class="interp">${esc(L.interpretation.text)}</div>`);
    if(l3Tabs(a).some(t=>t.html))h+=`<button class="detailBtn" data-tab="l3">Open detail view →</button>`}
  else if(tab==='ev'){const E=L.evidence;
    h=!(E.rule_version||FIXTURE)?q('Evidence',`<div class="panel"><div class="note">Relationships across practices are shown once the evidence rule is agreed.</div></div>`):q('Evidence',`<div class="panel"><div class="note">Tested across ${esc(E.tested_on)}. "Holds" = strong enough to use. "No relationship found" = checked, not there. These are patterns across practices, not proof of cause.</div><table class="evtab"><tr><th>Holds</th><th></th></tr>${E.associations.length?E.associations.map(([l,r])=>`<tr><td>${esc(l)}</td><td>${esc(r)}</td></tr>`).join(''):'<tr class="no"><td>None yet</td><td></td></tr>'}<tr><th>No relationship found</th><th></th></tr>${E.no_relationship.length?E.no_relationship.map(([l,r])=>`<tr class="no"><td>${esc(l)}</td><td>${esc(r)}</td></tr>`).join(''):'<tr class="no"><td>None yet</td><td></td></tr>'}</table></div>`)
     +q('Compared with',`<div class="panel"><div>${esc(E.comparators)}</div><div class="note">Standard: ${ASSURE[a.assurance]}</div></div>`)
     +q('Sources',`<div class="panel"><ul class="srcs">${E.sources.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`)}
  else{const tabs=l3Tabs(a);if(!sub||!tabs.find(t=>t.id===sub&&t.html))sub=(tabs.find(t=>t.html)||{}).id;
    h=`<div class="subtabs" role="tablist" aria-label="Detailed analysis">${tabs.map(t=>`<button role="tab" data-sub="${t.id}" aria-selected="${t.id===sub}" ${t.html?'':'disabled title="Not available in the published data"'}>${esc(t.label)}</button>`).join('')}</div>${(tabs.find(t=>t.id===sub)||{}).html||''}`}
  $('#dBody').innerHTML=h;$('#dBody').scrollTop=0}
function close(){document.body.classList.remove('open');dr.classList.remove('wide');cur=null;setTimeout(()=>{if(!cur)dr.hidden=true},260);last&&last.focus()}
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('#dClose')||t===$('#ov')){close();return}
  const s=t.closest('[data-sub]');if(s&&!s.disabled){sub=s.dataset.sub;show();return}
  const tb=t.closest('[data-tab]');if(tb&&!tb.disabled){tab=tb.dataset.tab;show();return}
  const o=t.closest('[data-open]');if(o){open(o.dataset.open)}});
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('open'))return;if(e.key==='Escape'){close();return}
  if(e.key==='Tab'){const f=[...dr.querySelectorAll('button:not([disabled]),[href]')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}}});
const tip=$('#tip');document.addEventListener('pointermove',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.classList.remove('on');return}tip.textContent=el.dataset.tip;tip.classList.add('on');
  tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(e.clientY+16+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+16)+'px'});
render();
</script>
